[theme]
primaryColor = "#3498db"
backgroundColor = "#f5f5f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c3e50"
font = "sans serif"

[client]
showErrorDetails = true
raiseOnScriptFileChangeWarning = false

[server]
port = 8501
headless = true
enableXsrfProtection = true
maxUploadSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = true
serverAddress = "localhost"
